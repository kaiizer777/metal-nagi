[package]
name = "nagi-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = { version = "0.13", default-features = false, features = ["apigw_http"] }
tokio = { workspace = true, features = ["process", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gh-core = { path = "../gh-core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
secrecy = { version = "0.10", features = ["serde"] }
thiserror = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
octocrab = { version = "0.42", default-features = false, features = ["rustls", "default-client"] }
chrono = { version = "0.4", features = ["serde"] }
